name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mterm-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mterm-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mterm-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mterm-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mterm-windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross for linux arm64
      - name: install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: copy artifact
        run: |
          src="target/${{ matrix.target }}/release/mterm"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then src="${src}.exe"; fi
          cp "$src" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}" 2>/dev/null || true
          ls -lh "${{ matrix.artifact }}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ensure installers are attached to release (double-click native)
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: install.command
          path: install.command
      - uses: actions/upload-artifact@v4
        with:
          name: install.bat
          path: install.bat

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        # Will create Release for tag v* with 5 binaries:
        # mterm-linux-x64, mterm-linux-arm64, mterm-macos-x64, mterm-macos-arm64, mterm-windows-x64.exe
