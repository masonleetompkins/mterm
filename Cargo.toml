[package]
name = "mterm"
version = "0.1.0"
edition = "2021"
description = "executable markdown — readme that runs"
license = "MIT"
repository = "https://github.com/masonleetompkins/mterm"

[[bin]]
name = "mterm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
pulldown-cmark = "0.10"
regex = "1.10"
anyhow = "1.0"
ratatui = "0.28"
crossterm = "0.28"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
comrak = "0.24"
